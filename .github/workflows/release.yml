name: Publish Package to npmjs

on:
  workflow_dispatch:
  push:
    tags: ["*"]

permissions:
    id-token: write
    contents: read
    
jobs:
  release:
    permissions:
      contents: read
      id-token: write # npm OIDC trusted publishing + provenance
      
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4 #Setup Node
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
        # Node 24.12.0 ships npm 11.6.2, which supports OIDC trusted publishing (needs npm >= 11.5.1).

    - name: Install dependencies
      run: |
        npm ci

    - name: Lint
      run: |
        npm run lint

    - name: Build
      run: |
        npm run build

    - name: Test
      run: |
        REFERRER="http://yandex.localhost/" APIKEY=${{ secrets.APIKEY }} npm test

    - name: Publish
      run: |
        npm publish ./ --access public
